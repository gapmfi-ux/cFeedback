<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Feedback - GHP Microfinance</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Meta refresh fallback to the target -->
  <meta http-equiv="refresh" content="1;url=https://gapmfi-ux.github.io/cFeedback/">
</head>
<body>
  <div class="container">
    <div class="header">
      <img id="logoImage" alt="GHP Microfinance logo" class="logo" />
      <h1>⭐ WE VALUE YOUR FEEDBACK!</h1>
      <p>Rate our services and help us improve</p>
    </div>

    <div class="qr-section">
      <div class="qr-placeholder" id="qrContainer" aria-hidden="false">
        <!-- QR fallback will be inserted here if JS redirect fails -->
      </div>
      <div class="qr-label">📱 SCAN TO OPEN THE FEEDBACK FORM</div>
      <div class="qr-sub">or open it directly</div>

      <div style="margin-top:16px; text-align:center;">
        <!-- Manual link points to the target URL -->
        <a id="openFormLink" href="https://gapmfi-ux.github.io/cFeedback/" class="submit-btn" style="display:inline-block; width:auto; padding:10px 18px; text-decoration:none;">Open Form</a>
      </div>
    </div>

    <div style="text-align:center; margin-top:12px; color:#718096;">
      <small>Scan the QR code with a mobile device or click "Open Form".</small>
    </div>

    <div style="height:16px"></div>

    <div class="footer">
      Thank you for helping us serve you better!
    </div>
  </div>

  <!-- logo data + loader (optional) -->
  <script src="logo-data.js"></script>
  <script src="logo.js"></script>

  <script>
    (function () {
      // Target absolute URL (point QR and links here)
      var targetUrl = 'https://gapmfi-ux.github.io/cFeedback/';

      // Immediate redirect (replace history so QR page isn't kept)
      try {
        window.location.replace(targetUrl);
        return;
      } catch (e) {
        // If redirect fails, fall back to rendering the page/QR
      }

      // Fallback: render QR pointing to targetUrl and update manual link
      var qrContainer = document.getElementById('qrContainer');
      if (qrContainer) {
        var qrImg = document.createElement('img');
        qrImg.alt = 'QR code to open feedback form';
        qrImg.width = 150;
        qrImg.height = 150;
        qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encodeURIComponent(targetUrl);
        qrContainer.innerHTML = '';
        qrContainer.appendChild(qrImg);
      }

      var openLink = document.getElementById('openFormLink');
      if (openLink) openLink.href = targetUrl;
    })();
  </script>
</body>
</html>
