<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Fallback meta refresh -->
  <meta http-equiv="refresh" content="0;url=https://gapmfi-ux.github.io/cFeedback/">
</head>
<body>
  <p>Redirecting to the feedback form… If you are not redirected automatically, <a href="https://gapmfi-ux.github.io/cFeedback/">click here</a>.</p>
  <script>
    // Immediate redirect without leaving this redirect page in history
    try {
      window.location.replace('https://gapmfi-ux.github.io/cFeedback/');
    } catch (e) {
      window.location.href = 'https://gapmfi-ux.github.io/cFeedback/';
    }
  </script>
</body>
</html>
